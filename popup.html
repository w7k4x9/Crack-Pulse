<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>펄스</title>
<link rel="stylesheet" href="mac.css">
<style>
  body { width: 330px; background: var(--window); }
  .pop { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .hd { display: flex; align-items: center; gap: 8px; padding: 0 2px; }
  .hd img { border-radius: 5px; }
  .hd b { font-size: 14px; flex: 1; }
  .hd .st { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--label-2); background: none; border: 0; cursor: pointer; padding: 2px 4px; border-radius: 5px; }
  .hd .st:hover { background: var(--hover); }
  .money { padding: 12px 14px; }
  .money .lbl { font-size: 12px; color: var(--label-2); display: flex; align-items: center; gap: 6px; }
  .money .big { font-size: 22px; font-weight: 600; letter-spacing: -.02em; line-height: 1.15; margin-top: 2px; }
  .money .big small { font-size: 13px; font-weight: 500; color: var(--label-2); margin-left: 1px; letter-spacing: 0; }
  .money .fc { display: flex; justify-content: space-between; font-size: 12px; margin-top: 6px; color: var(--label-2); }
  .money .fc b { color: var(--label); font-weight: 600; }
  .mini { display: grid; grid-template-columns: 1fr 1fr; }
  .mini > div { padding: 9px 14px; }
  .mini > div + div { border-left: .5px solid var(--sep); }
  .mini .l { font-size: 11.5px; color: var(--label-2); }
  .mini .v { font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
  .meta { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--label-2); padding: 0 4px; }
  .err { font-size: 12px; color: var(--down); padding: 0 4px; line-height: 1.45; }
  .prog { font-size: 12px; color: var(--label-2); padding: 0 4px; }
  .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .acts .btn { width: 100%; }
  .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; }
  .gl { margin-top: 8px; } .gb { height: 6px; border-radius: 3px; background: var(--seg-bg); overflow: hidden; } .gb div { height: 100%; background: var(--s-money); border-radius: 3px; } .gl .fc { margin-top: 4px; }
</style>
<script src="lib/theme.js"></script>
</head>
<body>
<div class="pop" id="pop"></div>
<script src="lib/core.js"></script>
<script src="popup.js"></script>
</body>
</html>
