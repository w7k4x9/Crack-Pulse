<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>펄스 업데이트</title>
<link rel="icon" href="icons/32.png">
<link rel="stylesheet" href="mac.css">
<style>
  body { min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 56px 16px; }
  .card { width: min(480px, 100%); background: var(--panel); border-radius: 14px; box-shadow: 0 18px 50px rgba(0,0,0,.14), 0 0 0 .5px var(--sep-strong); padding: 28px 28px 22px; text-align: center; }
  .card img { border-radius: 14px; }
  h1 { font-size: 19px; margin: 14px 0 4px; letter-spacing: -.02em; }
  .sub { font-size: 12.5px; }
  .notes { text-align: left; margin: 18px 0 4px; max-height: 260px; overflow: auto; }
  .notes section { background: var(--panel-2); border-radius: 9px; padding: 10px 14px; box-shadow: inset 0 0 0 .5px var(--sep); }
  .notes section + section { margin-top: 8px; }
  .notes h2 { font-size: 13px; margin: 0 0 4px; }
  .notes h2 span { font-weight: 500; color: var(--label-2); }
  .notes ul { margin: 0; padding-left: 18px; font-size: 12.5px; color: var(--label-2); }
  .msg { text-align: left; font-size: 12.5px; line-height: 1.6; margin: 16px 0 0; }
  .msg .warn { background: rgba(255,59,48,.1); color: var(--down); border-radius: 8px; padding: 8px 12px; margin-bottom: 10px; }
  .msg ol { padding-left: 18px; margin: 6px 0; }
  .msg code { font-size: 11.5px; background: var(--seg-bg); padding: 1px 5px; border-radius: 4px; }
  .acts { display: flex; flex-direction: column; gap: 8px; margin-top: 20px; }
  .acts .btn { width: 100%; }
  .tip { font-size: 11.5px; color: var(--label-2); margin-top: 10px; }
  .bar { height: 6px; background: var(--seg-bg); border-radius: 3px; overflow: hidden; margin: 20px 0 6px; }
  .bar div { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width .2s; }
  details { text-align: left; margin-top: 18px; font-size: 12.5px; border-top: .5px solid var(--sep); padding-top: 12px; }
  summary { cursor: pointer; color: var(--label-2); }
  details ol { padding-left: 18px; line-height: 1.7; }
</style>
<script src="lib/theme.js"></script>
</head>
<body>
<main class="card">
  <img src="icons/128.png" width="64" height="64" alt="">
  <h1 id="title">확인하는 중…</h1>
  <div class="sub" id="sub"></div>
  <div class="notes" id="notes"></div>
  <div class="msg" id="msg" hidden></div>
  <div id="progress" hidden><div class="bar"><div id="barFill"></div></div><div class="sub small" id="progressText"></div></div>
  <div class="acts"><button class="btn primary big" id="primary" hidden></button><button class="btn big" id="secondary" hidden></button></div>
  <div class="tip" id="tip" hidden></div>
  <details id="manual" hidden>
    <summary>직접 바꾸고 싶어요</summary>
    <ol>
      <li><a class="link" id="zipLink" href="#" target="_blank" rel="noopener">새 버전 zip</a>을 받아서 압축을 풀어요.</li>
      <li>풀린 폴더 안의 파일을 전부 복사해서 지금 펄스 폴더에 붙여 넣고 「덮어쓰기」를 골라요. 폴더 위치는 <a class="link" href="#" data-open-ext>확장 프로그램 페이지</a>의 펄스 → 세부정보 → 「소스」에 적혀 있어요.</li>
      <li>확장 프로그램 페이지에서 펄스의 새로고침(↻) 버튼을 눌러요.</li>
    </ol>
  </details>
</main>
<script src="lib/update-check.js"></script>
<script src="update.js"></script>
<script src="update-extra.js"></script>
</body>
</html>
